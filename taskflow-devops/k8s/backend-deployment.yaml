apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: taskflow
  labels:
    app: backend
    app.kubernetes.io/part-of: taskflow-platform
spec:
  # 1. High Availability: multiple replicas
  replicas: 2

  # 2. Zero-downtime rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Spin up 1 new pod before terminating old ones
      maxUnavailable: 0    # Never terminate an old pod until the new one is ready

  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: mithunmh19/taskflow-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: DATABASE_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: CORS_ORIGINS
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: ENVIRONMENT
            - name: SQL_ECHO
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: SQL_ECHO

          # 3. Predictable compute guarantees & prevention of noisy neighbors
          resources:
            requests:
              cpu: "100m"        # Minimum 0.1 CPU core guaranteed
              memory: "128Mi"    # Minimum 128 MB RAM guaranteed
            limits:
              cpu: "500m"        # Hard ceiling: max 0.5 CPU core
              memory: "512Mi"    # Hard ceiling: max 512 MB RAM (OOMKilled if exceeded)

          # 4. Readiness Probe: controls traffic routing from backend-service
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          # 5. Liveness Probe: detects deadlock/freeze and restarts the container
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
