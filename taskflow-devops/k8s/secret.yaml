apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow-platform
type: Opaque
stringData:
  POSTGRES_USER: "taskflow_user"
  POSTGRES_PASSWORD: "taskflow_password"
  POSTGRES_DB: "taskflow_db"
  DATABASE_URL: "postgresql://taskflow_user:taskflow_password@postgres-service:5432/taskflow_db"
