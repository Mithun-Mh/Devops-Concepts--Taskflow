apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow-platform
data:
  ENVIRONMENT: "production"
  APP_VERSION: "0.1.0"
  SQL_ECHO: "False"
  CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:30080"
  NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api"
