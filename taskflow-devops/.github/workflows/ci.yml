# ==============================================================================
# TaskFlow — Continuous Integration (CI) Workflow
# ==============================================================================
# Automated validation pipeline triggered on every git push and pull request.
# Ensures code quality, test verification, and container build integrity
# before code can be merged into production.
# ==============================================================================

name: TaskFlow CI Pipeline

# ------------------------------------------------------------------------------
# Triggers: When should this workflow run?
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# ------------------------------------------------------------------------------
# Jobs: Independent execution units running on isolated virtual machines
# ------------------------------------------------------------------------------
jobs:
  build-and-test:
    name: Build & Test (Backend & Frontend)
    runs-on: ubuntu-latest

    # Environment variables available to all steps in this job
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      CI: true

    steps:
      # ------------------------------------------------------------------------
      # 1. Checkout code
      # ------------------------------------------------------------------------
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------------------------
      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # ------------------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------------------
      - name: 3. Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # ------------------------------------------------------------------------
      # 4. Run backend tests (Fails pipeline immediately on any test failure)
      # ------------------------------------------------------------------------
      - name: 4. Run backend tests with pytest
        run: |
          pytest backend/tests -v --durations=10

      # ------------------------------------------------------------------------
      # 5. Build backend Docker image (Verifies container build integrity)
      # ------------------------------------------------------------------------
      - name: 5. Build backend Docker image
        run: |
          docker build -t taskflow-backend:ci ./backend

      # ------------------------------------------------------------------------
      # 6. Setup Node.js
      # ------------------------------------------------------------------------
      - name: 6. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ------------------------------------------------------------------------
      # 7. Install frontend dependencies
      # ------------------------------------------------------------------------
      - name: 7. Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      # ------------------------------------------------------------------------
      # 8. Build frontend (Validates TypeScript, JSX, and Next.js assets)
      # ------------------------------------------------------------------------
      - name: 8. Build Next.js production bundle
        working-directory: ./frontend
        run: |
          npm run build

      # ------------------------------------------------------------------------
      # 9. Build frontend Docker image (Test build only — do not push)
      # ------------------------------------------------------------------------
      - name: 9. Build frontend Docker image
        run: |
          docker build -t taskflow-frontend:ci ./frontend
