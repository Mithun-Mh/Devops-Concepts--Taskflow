# ==============================================================================
# TaskFlow — Continuous Integration & Image Publishing Pipeline
# ==============================================================================
# Two-stage automated pipeline:
#   1. test:    Validates backend pytest suite and compiles frontend Next.js bundle.
#               Runs on both pull requests and direct pushes to main.
#   2. publish: Authenticates to Docker Hub via GitHub Secrets, builds production
#               images, tags with semantic version, git short SHA, and latest,
#               then pushes to Docker Hub. Runs ONLY after test job succeeds on main.
# ==============================================================================

name: TaskFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  VERSION: "0.1.0"
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
  CI: "true"

jobs:

  # ============================================================================
  # STAGE 1: Automated Testing & Verification Gate
  # ============================================================================
  test:
    name: Run Automated Tests & Bundle Check
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # 3. Install backend dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. Run backend tests (Fails pipeline immediately on any failure)
      - name: Run backend tests with pytest
        run: |
          pytest backend/tests -v --durations=10

      # 5. Setup Node.js
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 6. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      # 7. Validate frontend build
      - name: Validate Next.js production build
        working-directory: ./frontend
        run: |
          npm run build

  # ============================================================================
  # STAGE 2: Build, Tag & Publish Container Images
  # ============================================================================
  publish:
    name: Build, Tag & Publish Images to Docker Hub
    needs: test
    # Publish only on merged/pushed commits to main, never on unreviewed PR branches
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (multi-platform container builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Authenticate to Docker Hub using GitHub Secrets (Zero hard-coded credentials)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Backend Image: Tag & Publish
      # ------------------------------------------------------------------------
      - name: Extract Docker metadata for Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}
            type=sha,format=short,prefix=

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      # ------------------------------------------------------------------------
      # Frontend Image: Tag & Publish
      # ------------------------------------------------------------------------
      - name: Extract Docker metadata for Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}
            type=sha,format=short,prefix=

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
