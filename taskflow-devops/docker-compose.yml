# ==============================================================================
# TaskFlow — Complete Multi-Service Environment (Docker Compose)
# ==============================================================================
# Orchestrates the three-tier TaskFlow platform:
#   1. PostgreSQL 16 (Database)
#   2. FastAPI (Backend REST API)
#   3. Next.js (Frontend Web UI)
#
# Architecture:
#   Browser (User)
#     │
#     ▼ (port 3000)
#   Next.js (taskflow-frontend)
#     │
#     ▼ (port 8000 / CORS)
#   FastAPI (taskflow-backend)
#     │
#     ▼ (port 5432 / taskflow-network)
#   PostgreSQL (taskflow-db)
#
# Usage:
#   docker compose up -d          # Build (if needed) & start all services in background
#   docker compose ps             # Check health status of all 3 services
#   docker compose logs -f        # Stream logs across all services
#   docker compose down           # Stop & remove containers, networks
#   docker compose down -v        # Stop & purge persistent PostgreSQL volume
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # 1. Database: PostgreSQL 16
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_password
      POSTGRES_DB: taskflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_user -d taskflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Backend API: FastAPI (Python 3.12)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taskflow-backend:latest
    container_name: taskflow-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://taskflow_user:taskflow_password@db:5432/taskflow_db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ENVIRONMENT: development
      SQL_ECHO: "False"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').getcode() == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Frontend: Next.js (Node 20 Alpine)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    image: taskflow-frontend:latest
    container_name: taskflow-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: taskflow_postgres_data

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  taskflow-network:
    name: taskflow-network
    driver: bridge
